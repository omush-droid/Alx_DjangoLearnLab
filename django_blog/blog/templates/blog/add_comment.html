{% extends 'blog/base.html' %}

{% block content %}
<div class="container">
    <h2>Add Comment</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Add Comment</button>
        <a href="{% url 'post-detail' view.kwargs.post_id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
