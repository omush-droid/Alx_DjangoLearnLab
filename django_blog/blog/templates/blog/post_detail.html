{% extends 'blog/base.html' %}

{% block content %}
<div class="container">
    <article class="post-detail">
        <h1>{{ post.title }}</h1>
        <p class="post-meta">By {{ post.author.username }} on {{ post.published_date|date:"F d, Y" }}</p>
        
        {% if user == post.author %}
            <div class="post-actions mb-3">
                <a href="{% url 'post-update' post.pk %}" class="btn btn-secondary">Edit</a>
                <a href="{% url 'post-delete' post.pk %}" class="btn btn-danger">Delete</a>
            </div>
        {% endif %}
        
        <div class="post-content">
            {{ post.content|linebreaks }}
        </div>
    </article>
    
    <div class="mt-4">
        <a href="{% url 'post-list' %}" class="btn btn-primary">Back to Posts</a>
    </div>
</div>
{% endblock %}
