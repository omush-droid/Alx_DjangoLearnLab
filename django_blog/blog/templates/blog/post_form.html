{% extends 'blog/base.html' %}

{% block content %}
<div class="container">
    <h2>{% if form.instance.pk %}Edit Post{% else %}Create New Post{% endif %}</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">
            {% if form.instance.pk %}Update Post{% else %}Create Post{% endif %}
        </button>
        <a href="{% url 'post-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
